<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17161c"/>
      <stop offset="0.55" stop-color="#1f1e26"/>
      <stop offset="1" stop-color="#191622"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.84" cy="0.5" r="0.52">
      <stop offset="0" stop-color="#9D5FD3" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#9D5FD3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <linearGradient id="stripe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9D5FD3"/>
      <stop offset="1" stop-color="#5E2590"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>
  <rect x="0" y="0" width="7" height="320" fill="url(#stripe)"/>

  <g transform="translate(74 0)">
    <text x="0" y="162" font-family="Helvetica, Arial, sans-serif" font-size="82" font-weight="bold" letter-spacing="-1"><tspan fill="#f2f3f5">PokeFoundry</tspan></text>
    <text x="3" y="212" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#a099ad" letter-spacing="7.5">SHOPIFY MONITOR</text>
    <rect x="3" y="238" width="58" height="3" fill="#9D5FD3"/>
  </g>

  <g transform="translate(1206 160)" opacity="0.95">
    <circle cx="0" cy="0" r="7" fill="#9D5FD3"/>
    <circle cx="0" cy="0" r="15" fill="none" stroke="#9D5FD3" stroke-opacity="0.4" stroke-width="2"/>
    <circle cx="0" cy="0" r="25" fill="none" stroke="#9D5FD3" stroke-opacity="0.18" stroke-width="2"/>
  </g>
  <text x="1178" y="166" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#857e91" letter-spacing="4.5">CHANGELOG</text>
</svg>
